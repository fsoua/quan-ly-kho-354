<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Biểu đồ tỷ trọng lãi theo danh mục</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f9f9f9; }
        .container { max-width: 700px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        form { margin-bottom: 20px; display: flex; gap: 15px; align-items: center; }
        input[type="date"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #218838; }
        .chart-container { position: relative; width: 100%; max-width: 450px; margin: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Tỷ Trọng Lợi Nhuận Theo Danh Mục Đồ Vật</h2>
        
        <!-- Form lọc khoảng thời gian -->
        <form method="GET">
            <label>Từ ngày:</label>
            <input type="date" name="start_date" value="{{ start_date }}">
            
            <label>Đến ngày:</label>
            <input type="date" name="end_date" value="{{ end_date }}">
            
            <button type="submit">Lọc</button>
        </form>

        <!-- Khung chứa biểu đồ tròn -->
        <div class="chart-container">
            <canvas id="categoryPieChart"></canvas>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('categoryPieChart').getContext('2d');
        const categoryPieChart = new Chart(ctx, {
            type: 'doughnut', // Hoặc đổi thành 'pie' nếu thích hình tròn đặc
            data: {
                labels: {{ categories|safe }},
                datasets: [{
                    label: 'Lợi nhuận (VNĐ)',
                    data: {{ profits|safe }},
                    backgroundColor: [
                        'rgba(255, 99, 132, 0.7)',
                        'rgba(54, 162, 235, 0.7)',
                        'rgba(255, 206, 86, 0.7)',
                        'rgba(75, 192, 192, 0.7)',
                        'rgba(153, 102, 255, 0.7)',
                        'rgba(255, 159, 64, 0.7)'
                    ],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'bottom',
                    }
                }
            }
        });
    </script>
</body>
</html>
