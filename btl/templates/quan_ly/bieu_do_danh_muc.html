<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Biểu đồ lợi nhuận từng đồ vật</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f9f9f9; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        form { margin-bottom: 20px; display: flex; gap: 15px; align-items: center; }
        input[type="date"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #218838; }
        .chart-container { position: relative; width: 100%; height: 600px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Lợi Nhuận Chi Tiết Theo Từng Đồ Vật</h2>
        
        <form method="GET">
            <label>Từ ngày:</label>
            <input type="date" name="start_date" value="{{ start_date }}">
            
            <label>Đến ngày:</label>
            <input type="date" name="end_date" value="{{ end_date }}">
            
            <button type="submit">Lọc</button>
        </form>
        <div class="chart-container">
            <canvas id="itemBarChart"></canvas>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('itemBarChart').getContext('2d');
        const itemBarChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: {{ item_names|safe }},
                datasets: [{
                    label: 'Tổng lợi nhuận (VNĐ)',
                    data: {{ profits|safe }},
                    backgroundColor: 'rgba(54, 162, 235, 0.7)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>
</body>
</html>
